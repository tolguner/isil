# Sürüm etiketi itilince Windows yükleyicisini derler ve taslak GitHub sürümüne ekler:
#   git tag v0.4.0 && git push origin v0.4.0
# Taslak, gözden geçirilip GitHub'da elle yayımlanır. Yükleyici imzasızdır (SmartScreen uyarısı verir).
# Windows dakikaları özel repoda 2 kat sayıldığı için yalnızca etiketle ya da elle çalışır.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows yükleyicisi
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Derle ve paketle
        run: npx electron-vite build && npx electron-builder --win --publish never
      - name: Yükleyiciyi sakla
        uses: actions/upload-artifact@v4
        with:
          name: Isil-Setup
          retention-days: 14
          path: release/*.exe
      - name: Taslak sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Işıl ${tag#v}" --generate-notes
          gh release upload "$tag" release/*.exe --clobber
