# Her push ve PR'da hızlı kontrol: tür denetimi + üretim derlemesi.
# Modeller ve Electron ikilisi gerekmediği için kurulum betikleri atlanır (--ignore-scripts),
# böylece iş birkaç dakikada biter ve özel repoda Actions dakikası az harcanır.
name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'replica/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'replica/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tür denetimi + derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python motoru (sözdizimi + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Yerel YZ motoru (engine/server.py) ve test yardımcıları: sözdizimi hatası ve
      # pyflakes sınıfı sorunlar (tanımsız ad, kullanılmayan içe aktarma vb.). Biçim kuralları yok.
      - run: python -m py_compile engine/server.py
      - run: pip install ruff==0.17.1
      - run: ruff check engine tests/fixtures --select E9,F --output-format github
