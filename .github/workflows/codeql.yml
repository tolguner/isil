# Kod taraması (CodeQL): depo herkese açık olduğu için ücretsiz.
# TypeScript/JavaScript (Electron + arayüz) ve Python (YZ motoru) için güvenlik ve kalite sorguları.
name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'replica/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'replica/**', 'LICENSE']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
