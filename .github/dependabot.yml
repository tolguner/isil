# Bağımlılık güncellemeleri: ayda bir, gruplanmış tek PR (her PR CI dakikası harcar).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Ana sürüm atlamaları (vite 8, electron 45 …) çoğu zaman kod değişikliği ister; elle, ayrı iş olarak yapılır.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
